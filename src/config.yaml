site:
  name: Michael Moreno
  # The origin is resolved at build time from NEXT_PUBLIC_SITE_URL, then the
  # Vercel system URLs, then localhost. See vendor/integration/utils/siteUrl.ts.
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: 'Michael Moreno | Product Marketing Leader, Security, Data & AI'
    template: '%s | Michael Moreno'
  description: 'Product and partner marketing leader who translates technology features into business outcomes that drive revenue. Security, data, and AI.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Michael Moreno
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
